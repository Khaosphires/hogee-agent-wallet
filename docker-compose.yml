# Local services (project.md §18.2). Start with: docker compose up -d
# Credentials below are local-dev only and match .env.example.
# G0-AUDIT (v-3): every port binds 127.0.0.1 (project.md: "Scope right now: localhost only"). A mapping without a host IP
# lets the container runtime publish on all interfaces, which would expose the hogee/hogee superuser to the LAN.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hogee
      # Override on any shared or always-on host (the loop host); DATABASE_URL must use the same value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hogee}
      POSTGRES_DB: hogee
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogee -d hogee"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stock image; our MY/ID recognizers are sent as ad-hoc regex recognizers per /analyze request
  # (built from data/pii/recognizers.json by packages/privacy).
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    ports:
      - "127.0.0.1:5002:3000"
    networks: [pii]

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    ports:
      - "127.0.0.1:5001:3000"
    networks: [pii]

# Presidio handles untrusted text, so it shares no network with Postgres.
networks:
  db:
  pii:

volumes:
  pgdata:
